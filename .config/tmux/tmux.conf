# Tmux Configuration
# -- Prefix & Core Behavior ----------------------------------
set -g prefix C-a                  # C-a is easier to reach than C-b
bind C-a send-prefix               # Double C-a sends literal C-a to apps (e.g. vim)
unbind C-b

set -g escape-time 10              # 500ms is too slow for vim/neovim — 10ms is safe
set -g history-limit 50000         # 5000 is low; 50k costs little RAM
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on         # Auto-renumber when a window closes
set -g mouse on
set -g focus-events on             # Lets vim/neovim know when terminal gains focus
set -g set-clipboard on            # Sync tmux clipboard with system clipboard

# -- Display -------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # True color support

# -- Keybindings: Splits & Navigation ------------------------
bind | split-window -h -c "#{pane_current_path}"   # Intuitive split symbols
bind - split-window -v -c "#{pane_current_path}"   # Opens in current dir
unbind '"'
unbind %

bind h select-pane -L              # Vim-style pane navigation
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5        # Resize panes with shift+hjkl
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display "Config reloaded"  # Quick reload

# -- Copy Mode (vi-style) ------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- Status Bar ---------------------------------------------
set -g status-position bottom
set -g status-interval 5           # 1s is excessive; 5s saves CPU

set -g status-left " #S "
set -g status-left-length 20

set -g status-right " #{?client_prefix,#[bg=colour1] PREFIX #[default]}"
set -g status-right-length 60

# Clean window list
setw -g window-status-format " [#I] #W "
setw -g window-status-current-format " [#I] #W "

# -- Plugins -----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # Auto-saves resurrect every 15min

# tmux-resurrect: also restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: auto-restore on tmux server start
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
